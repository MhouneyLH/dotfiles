---
- name: Install Claude Code CLI
  ansible.builtin.shell: |
    npm install -g @anthropic-ai/claude-code
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
    NPM_CONFIG_PREFIX: "{{ user_home }}/.local"
  args:
    creates: "{{ user_home }}/.local/bin/claude"

- name: Install caveman plugin
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/main/install.sh | bash
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
  args:
    creates: "{{ user_home }}/.claude/plugins/marketplaces/caveman"

- name: Install trivy vulnerability scanner
  ansible.builtin.shell: |
    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  args:
    creates: /usr/local/bin/trivy

- name: Install govulncheck (Go vulnerability scanner)
  ansible.builtin.shell: |
    go install golang.org/x/vuln/cmd/govulncheck@latest
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
    PATH: "/usr/local/go/bin:{{ user_home }}/go/bin:{{ ansible_env.PATH }}"
  args:
    creates: "{{ user_home }}/go/bin/govulncheck"
