---
- name: Ensure ~/.claude/rules directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.claude/rules"
    state: directory
    owner: "{{ user_name }}"
    mode: "0755"

- name: Symlink global CLAUDE.md
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/claude/AGENTS.md"
    dest: "{{ user_home }}/.claude/CLAUDE.md"
    state: link
    owner: "{{ user_name }}"
    force: true

- name: Symlink context7 rule
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/claude/rules/context7.md"
    dest: "{{ user_home }}/.claude/rules/context7.md"
    state: link
    owner: "{{ user_name }}"
    force: true

- name: Register lucas-dotfiles Claude plugin marketplace
  ansible.builtin.shell: |
    claude plugin marketplace add "{{ git_repos_path }}/dotfiles" --scope user
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
    PATH: "{{ user_home }}/.local/bin:{{ ansible_env.PATH }}"
  changed_when: true

- name: Install dotfiles-skills plugin (cold-review)
  ansible.builtin.shell: |
    claude plugin install dotfiles-skills@lucas-dotfiles
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
    PATH: "{{ user_home }}/.local/bin:{{ ansible_env.PATH }}"
  changed_when: true

- name: Register mattpocock skills marketplace
  ansible.builtin.shell: |
    claude plugin marketplace add mattpocock/skills --scope user
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
    PATH: "{{ user_home }}/.local/bin:{{ ansible_env.PATH }}"
    CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1"
  changed_when: true

- name: Install mattpocock-skills plugin (grill-me, grilling, and more)
  ansible.builtin.shell: |
    claude plugin install mattpocock-skills@mattpocock
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
    PATH: "{{ user_home }}/.local/bin:{{ ansible_env.PATH }}"
  changed_when: true

- name: Create .env from example if absent
  ansible.builtin.copy:
    src: "{{ git_repos_path }}/dotfiles/.env.example"
    dest: "{{ git_repos_path }}/dotfiles/.env"
    force: false
    owner: "{{ user_name }}"
    mode: "0600"

- name: Configure Claude Code permissions
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import json, os
    perms_src = "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/claude/claude-permissions.json"
    settings_path = os.path.expanduser("~/.claude/settings.json")
    with open(perms_src, "r") as f:
        perms = json.load(f)
    try:
        with open(settings_path, "r") as f:
            config = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        config = {}
    config["permissions"] = perms
    with open(settings_path, "w") as f:
        json.dump(config, f, indent=2)
    print("Permissions configured.")
    PYEOF
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
  changed_when: true

- name: Create mcp.json from example if absent
  ansible.builtin.copy:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/claude/mcp.json.example"
    dest: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/claude/mcp.json"
    force: false
    owner: "{{ user_name }}"
    mode: "0600"

- name: Merge mcpServers into ~/.claude.json
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import json, os
    mcp_src = "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/claude/mcp.json"
    claude_json = os.path.expanduser("~/.claude.json")
    with open(mcp_src, "r") as f:
        mcp = json.load(f)
    try:
        with open(claude_json, "r") as f:
            config = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        config = {}
    config["mcpServers"] = mcp["mcpServers"]
    with open(claude_json, "w") as f:
        json.dump(config, f, indent=2)
    print("mcpServers merged.")
    PYEOF
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
  changed_when: true
