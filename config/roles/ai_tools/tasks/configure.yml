---
- name: Ensure ~/.claude/rules directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.claude/rules"
    state: directory
    owner: "{{ user_name }}"
    mode: "0755"

- name: Symlink global CLAUDE.md
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/AGENTS.md"
    dest: "{{ user_home }}/.claude/CLAUDE.md"
    state: link
    owner: "{{ user_name }}"
    force: true

- name: Symlink context7 rule
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/rules/context7.md"
    dest: "{{ user_home }}/.claude/rules/context7.md"
    state: link
    owner: "{{ user_name }}"
    force: true

- name: Ensure ~/.claude/skills directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.claude/skills"
    state: directory
    owner: "{{ user_name }}"
    mode: "0755"

- name: Symlink cold-review skill
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/skills/cold-review"
    dest: "{{ user_home }}/.claude/skills/cold-review"
    state: link
    owner: "{{ user_name }}"
    force: true

- name: Symlink soccer-shorts skill
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/skills/soccer-shorts"
    dest: "{{ user_home }}/.claude/skills/soccer-shorts"
    state: link
    owner: "{{ user_name }}"
    force: true

- name: Create .env from example if absent
  ansible.builtin.copy:
    src: "{{ git_repos_path }}/dotfiles/.env.example"
    dest: "{{ git_repos_path }}/dotfiles/.env"
    force: false
    owner: "{{ user_name }}"
    mode: "0600"

# Merge permissions into settings.json without overwriting caveman-managed fields
- name: Configure Claude Code permissions
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import json, os
    path = os.path.expanduser('~/.claude/settings.json')
    try:
        with open(path, 'r') as f:
            config = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        config = {}
    config['permissions'] = {
        'allow': [
            'Bash(ls*)', 'Bash(cat*)', 'Bash(find*)', 'Bash(grep*)',
            'Bash(echo*)', 'Bash(which*)', 'Bash(env*)', 'Bash(pwd*)', 'Bash(cd*)',
            'Bash(mkdir*)', 'Bash(rm*)', 'Bash(mv*)', 'Bash(cp*)', 'Bash(ln*)',
            'Bash(chmod*)', 'Bash(chown*)', 'Bash(touch*)',
            'Bash(npm*)', 'Bash(node*)', 'Bash(npx*)',
            'Bash(pnpm*)', 'Bash(python*)', 'Bash(pip*)', 'Bash(uv*)',
            'Bash(docker*)', 'Bash(kubectl*)', 'Bash(k9s*)', 'Bash(minikube*)',
            'Bash(terraform*)', 'Bash(ansible*)',
            'Bash(cargo*)', 'Bash(go*)',
            'Bash(curl*)', 'Bash(wget*)',
            'Bash(git *)',
            'Bash(gh *)',
            'Bash(npm audit*)', 'Bash(trivy*)', 'Bash(pip-audit*)',
            'Bash(govulncheck*)', 'Bash(dotnet list*)',
            'Bash(jq*)', 'Bash(sed*)', 'Bash(awk*)', 'Bash(sort*)',
            'Bash(head*)', 'Bash(tail*)', 'Bash(wc*)', 'Bash(xargs*)',
            'Read(*)', 'Write(*)', 'Edit(*)', 'MultiEdit(*)',
            'Glob(*)', 'Grep(*)',
            'WebFetch(*)', 'WebSearch(*)',
            'Agent(*)',
            'mcp__context7__*',
            'mcp__sequential-thinking__*',
        ]
    }
    with open(path, 'w') as f:
        json.dump(config, f, indent=2)
    print('Permissions configured.')
    PYEOF
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
  changed_when: true

- name: Create mcp.json from example if absent
  ansible.builtin.copy:
    src: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/mcp.json.example"
    dest: "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/mcp.json"
    force: false
    owner: "{{ user_name }}"
    mode: "0600"

- name: Merge mcpServers into ~/.claude.json
  ansible.builtin.shell: |
    python3 - <<'PYEOF'
    import json, os
    mcp_src = "{{ git_repos_path }}/dotfiles/config/roles/ai_tools/files/mcp.json"
    claude_json = os.path.expanduser("~/.claude.json")
    with open(mcp_src, "r") as f:
        mcp = json.load(f)
    try:
        with open(claude_json, "r") as f:
            config = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        config = {}
    config["mcpServers"] = mcp["mcpServers"]
    with open(claude_json, "w") as f:
        json.dump(config, f, indent=2)
    print("mcpServers merged.")
    PYEOF
  become_user: "{{ user_name }}"
  become: true
  environment:
    HOME: "{{ user_home }}"
  changed_when: true
