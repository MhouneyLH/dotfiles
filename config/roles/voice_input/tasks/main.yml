---
- name: Install nerd-dictation system dependencies
  ansible.builtin.apt:
    name:
      - python3-pyaudio
      - portaudio19-dev
      - xdotool
      - sox
      - golang-go
      - libxkbcommon-dev
      - pkg-config
      - unzip
    state: present
  tags: voice_input_deps

- name: Install python3-full for venv support
  ansible.builtin.apt:
    name: python3-full
    state: present
  tags: voice_input_vosk

- name: Create vosk venv
  ansible.builtin.command:
    cmd: python3 -m venv {{ user_home }}/.local/share/nerd-dictation-venv
    creates: "{{ user_home }}/.local/share/nerd-dictation-venv/bin/python"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_vosk

- name: Install vosk into venv
  ansible.builtin.pip:
    name: vosk
    state: present
    virtualenv: "{{ user_home }}/.local/share/nerd-dictation-venv"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_vosk

- name: Clone nerd-dictation
  ansible.builtin.git:
    repo: https://github.com/ideasman42/nerd-dictation.git
    dest: "{{ user_home }}/.local/share/nerd-dictation"
    version: main
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_install

- name: Create vosk models directory
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/vosk"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_model

- name: Download vosk English model (lgraph: far more accurate than the small model, ~130 MB)
  ansible.builtin.get_url:
    url: https://alphacephei.com/vosk/models/vosk-model-en-us-0.22-lgraph.zip
    dest: /tmp/vosk-model-en-us-0.22-lgraph.zip
    mode: "0644"
  tags: voice_input_model

- name: Extract vosk model
  ansible.builtin.unarchive:
    src: /tmp/vosk-model-en-us-0.22-lgraph.zip
    dest: "{{ user_home }}/.local/share/vosk/"
    remote_src: true
    creates: "{{ user_home }}/.local/share/vosk/vosk-model-en-us-0.22-lgraph"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_model

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_script

- name: Install nerd-dictation toggle script
  ansible.builtin.copy:
    src: nerd-dictation-toggle
    dest: "{{ user_home }}/.local/bin/nerd-dictation-toggle"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_script

- name: Install dotool (types text on Wayland via uinput)
  ansible.builtin.command:
    cmd: go install git.sr.ht/~geb/dotool@latest
    creates: "{{ user_home }}/.local/bin/dotool"
  environment:
    GOBIN: "{{ user_home }}/.local/bin"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_dotool

- name: Allow input group access to /dev/uinput for dotool
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-dotool.rules
    content: |
      KERNEL=="uinput", GROUP="input", MODE="0660", OPTIONS+="static_node=uinput"
    mode: "0644"
  tags: voice_input_dotool

- name: Add user to input group
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: input
    append: true
  tags: voice_input_dotool

- name: Ensure nerd-dictation config directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/nerd-dictation"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_config

- name: Symlink nerd-dictation text processing config
  ansible.builtin.file:
    src: "{{ git_repos_path }}/dotfiles/config/roles/voice_input/files/nerd-dictation.py"
    dest: "{{ user_home }}/.config/nerd-dictation/nerd-dictation.py"
    state: link
    force: true
  become_user: "{{ user_name }}"
  become: true
  tags: voice_input_config
